name: 18-Hour Quran Video

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/daily-quran-video.yml
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render and validate without uploading
        required: true
        type: boolean
        default: true
      advance_state:
        description: Advance state after a successful dry run
        required: true
        type: boolean
        default: false

concurrency:
  group: quran-video-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Gate 18-hour scheduled run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone

          event = os.environ["EVENT_NAME"]
          schedule = os.environ.get("EVENT_SCHEDULE") or None
          if event == "workflow_dispatch":
              run = True
          else:
              run = False
              if event == "schedule" and schedule == "37 * * * *":
                  now = datetime.now(timezone.utc)
                  raw = subprocess.run(
                      ["git", "log", "-1", "--format=%cI", "--", "automation/state.json"],
                      check=False,
                      capture_output=True,
                      text=True,
                  ).stdout.strip()
                  if not raw:
                      run = True
                  else:
                      last_success = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      run = now - last_success >= timedelta(hours=18)
          print(f"run={str(run).lower()}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PY
      - name: Stop skipped schedule
        if: steps.gate.outputs.run != 'true'
        run: echo "Last successful automation state update is less than 18 hours old."
      - name: Install system dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-hosny-amiri fonts-liberation2 libfribidi0 libharfbuzz0b libass9 unzip
      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Doctor
        if: steps.gate.outputs.run == 'true'
        run: python scripts/doctor.py --ci
      - name: Render automation candidate
        if: steps.gate.outputs.run == 'true'
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: production
          QURAN_VIDEO_DATA_MODE: quranfoundation
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ADVANCE_STATE: ${{ inputs.advance_state || 'false' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m quran_video.automation.runner
      - name: Commit automation state
        if: steps.gate.outputs.run == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "automation: record daily Quran video state"
          git pull --rebase
          git push
