[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quran-video-platform"
version = "0.1.0"
description = "Private Quran video editor and unattended YouTube automation"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Quran Video Platform"}]
dependencies = [
  "fastapi==0.124.2",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "httpx==0.28.1",
  "redis==7.1.0",
  "rq==2.6.1",
  "pillow==12.0.0",
  "google-api-python-client==2.190.0",
  "google-auth==2.41.1",
  "google-auth-oauthlib==1.2.3",
  "google-auth-httplib2==0.2.1",
  "python-multipart==0.0.20",
  "PyYAML==6.0.3",
  "regex==2025.11.3",
]

[project.optional-dependencies]
dev = [
  "ruff==0.14.8",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "respx==0.22.0",
  "fakeredis==2.32.1",
  "types-PyYAML==6.0.12.20260518",
  "types-requests==2.33.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/quran_video", "apps/api/quran_video_api", "worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "worker", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
packages = ["quran_video", "quran_video_api", "worker"]
files = ["apps", "packages", "worker", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that exercise service boundaries with mocks",
  "rendering: tests that invoke ffmpeg",
]
